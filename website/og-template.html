<!DOCTYPE html>
<!-- Template for public/og.png (1200x630).  Not part of the build; see
     DESIGN.md for how to regenerate the image from this file. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: #fcfcfb;
        background-image: radial-gradient(
          75rem 35rem at 50% -10rem,
          rgb(190 52 80 / 7%),
          transparent 72%
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        font-family: "IBM Plex Mono", monospace;
        color: #221e1b;
      }

      .eyebrow {
        font-size: 24px;
        color: #a39c92;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 110px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
        width: fit-content;
      }

      h1::after {
        content: "================================================================================";
        display: block;
        overflow: hidden;
        width: 0;
        min-width: 100%;
        white-space: nowrap;
        line-height: 1.05;
        font-weight: 400;
        color: #be3450;
      }

      .tagline {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 40px;
        line-height: 1.4;
        margin-top: 40px;
        color: #221e1b;
      }

      .url {
        position: absolute;
        left: 96px;
        bottom: 56px;
        font-size: 22px;
        color: #6e6861;
      }
    </style>
  </head>
  <body>
    <div class="eyebrow">&lt;!-- an opinionated Markdown formatter --&gt;</div>
    <h1>Hongdown</h1>
    <p class="tagline">Markdown, readable before it renders.</p>
    <div class="url">dahlia.github.io/hongdown</div>
  </body>
</html>
